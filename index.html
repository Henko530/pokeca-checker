<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ自動センタリング</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 4px solid #333; border-radius: 8px; }
        .btn { background: #d9534f; color: white; padding: 15px 30px; border-radius: 10px; border: none; font-size: 18px; margin: 10px; width: 80%; }
    </style>
</head>
<body>
    <h3>完全自動センタリング測定</h3>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">画像を選んで解析</button>
    <br>
    <canvas id="canvasInput"></canvas>
    <p id="msg" style="font-size: 22px; font-weight: bold; margin-top: 15px;">画像を読み込んでください</p>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    analyzeCard();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function analyzeCard() {
            msg.innerText = "解析中...";
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // カードの枠を探す（背景の黒さを無視して、少し明るい部分を探す）
            let minX = canvas.width, maxX = 0;
            // エッジ検出の閾値を少し厳しく設定
            const threshold = 150; 

            for (let y = 100; y < canvas.height - 100; y += 5) {
                for (let x = 100; x < canvas.width - 100; x += 5) {
                    const i = (y * canvas.width + x) * 4;
                    // 背景の黒（R,G,Bが低い）以外のピクセルを見つける
                    if (data[i] > threshold || data[i+1] > threshold || data[i+2] > threshold) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                    }
                }
            }
            
            // 枠を描画
            ctx.strokeStyle = "red"; ctx.lineWidth = 15;
            ctx.strokeRect(minX, 50, maxX - minX, canvas.height - 100);
            
            const leftWidth = minX;
            const rightWidth = canvas.width - maxX;
            const total = leftWidth + rightWidth;
            const ratio = Math.round((leftWidth / (leftWidth + rightWidth)) * 100);
            
            msg.innerText = "左右比率 " + ratio + " : " + (100 - ratio);
        }
    </script>
</body>
</html>
