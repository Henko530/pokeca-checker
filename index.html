<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ精密センタリング</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 4px solid #333; }
        .btn { background: #007bff; color: white; padding: 15px 30px; border-radius: 10px; border: none; font-size: 18px; margin: 10px; width: 80%; }
    </style>
</head>
<body>
    <h3>精密センタリング測定</h3>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">画像を読み込んで解析</button>
    <br>
    <canvas id="canvasInput"></canvas>
    <p id="msg" style="font-size: 20px; font-weight: bold; margin-top: 15px;"></p>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    analyzeBorders();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function analyzeBorders() {
            msg.innerText = "内側の枠を解析中...";
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // カード中央付近の横ラインを走査して、急激に色が切り替わる「ボーダーライン」を探す
            let midY = Math.floor(canvas.height / 2);
            let leftEdge = 0, rightEdge = canvas.width;

            // 左から走査
            for (let x = 0; x < canvas.width / 2; x++) {
                let i = (midY * canvas.width + x) * 4;
                if (data[i] > 100) { // 背景の黒からカードの枠（白い部分など）に変わる点を探索
                    leftEdge = x; break;
                }
            }
            // 右から走査
            for (let x = canvas.width - 1; x > canvas.width / 2; x--) {
                let i = (midY * canvas.width + x) * 4;
                if (data[i] > 100) {
                    rightEdge = x; break;
                }
            }

            // 線を描画
            ctx.strokeStyle = "yellow"; ctx.lineWidth = 15;
            ctx.beginPath(); ctx.moveTo(leftEdge, 0); ctx.lineTo(leftEdge, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rightEdge, 0); ctx.lineTo(rightEdge, canvas.height); ctx.stroke();

            const leftMargin = leftEdge;
            const rightMargin = canvas.width - rightEdge;
            const ratio = Math.round((leftMargin / (leftMargin + rightMargin)) * 100);
            
            msg.innerText = "枠内比率 " + ratio + " : " + (100 - ratio);
        }
    </script>
</body>
</html>
