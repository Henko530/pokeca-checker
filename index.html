<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ポケカ鑑定 Pro+ハイブリッド</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; background: #1a1a1a; color: white; overflow-x: hidden; }
        .controls { padding: 15px; background: #222; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; justify-content: center; gap: 10px; }
        .btn { background: #28a745; color: white; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; }
        .mode-btn { background: #444; color: #ccc; flex: 1; max-width: 100px; }
        .mode-btn.active { background: #007bff; color: white; }
        .guide-btn { background: #666; font-size: 12px; }
        .container { position: relative; display: inline-block; touch-action: none; background: #000; }
        canvas { max-width: 100%; cursor: crosshair; display: block; }
        #loupe {
            position: fixed; top: 10px; right: 10px; width: 130px; height: 130px;
            border: 3px solid #007bff; border-radius: 50%; overflow: hidden;
            display: none; z-index: 1000; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        #loupe-canvas { width: 100%; height: 100%; }
        .result-panel { display: flex; justify-content: space-around; padding: 15px; background: #000; font-size: 18px; font-weight: bold; border-top: 1px solid #333; }
        .psa-label { font-size: 22px; font-weight: bold; padding: 10px; background: #000; }
        /* モーダル表示 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
        #modal img { max-width: 90%; border: 2px solid white; }
    </style>
</head>
<body>
    <div id="loupe"><canvas id="loupe-canvas"></canvas></div>
    
    <!-- 裏面ガイド用モーダル -->
    <div id="modal" onclick="this.style.display='none'">
        <p>【裏面の合わせ方】</p>
        <div style="color:#ffdd00; padding:10px; font-size:14px;">外側の黄色い枠ではなく、<br>内側の「紺色の角」に照準を合わせます！</div>
        <img src="https://img.buio.jp/card_back_guide.jpg" alt="Guide"> <!-- ここにガイド画像を差し替え可能 -->
        <p style="font-size:12px;">タップで閉じる</p>
    </div>

    <div class="controls">
        <div class="row">
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
            <button class="btn" onclick="document.getElementById('fileInput').click()">画像を読み込む</button>
        </div>
        <div class="row">
            <button id="modeFront" class="btn mode-btn active" onclick="setMode('front')">表面</button>
            <button id="modeBack" class="btn mode-btn" onclick="setMode('back')">裏面</button>
            <button class="btn guide-btn" onclick="document.getElementById('modal').style.display='flex'">裏面ガイド</button>
        </div>
    </div>
    
    <div class="container" id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="result-panel">
        <div>左右 <span id="lrRatio">--:--</span></div>
        <div>上下 <span id="tbRatio">--:--</span></div>
    </div>
    <div id="psaCheck" class="psa-label"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const loupe = document.getElementById('loupe');
        const loupeCanvas = document.getElementById('loupe-canvas');
        const lctx = loupeCanvas.getContext('2d');
        
        let img = new Image();
        let pts = [];
        let dragIdx = -1;
        let currentMode = 'front';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFront').classList.toggle('active', mode === 'front');
            document.getElementById('modeBack').classList.toggle('active', mode === 'back');
            calculate();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    pts = [
                        {x: img.width*0.2, y: img.height*0.2}, {x: img.width*0.8, y: img.height*0.2},
                        {x: img.width*0.8, y: img.height*0.8}, {x: img.width*0.2, y: img.height*0.8}
                    ];
                    draw();
                };
                img.src = f.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function draw() {
            ctx.drawImage(img, 0, 0);
            ctx.strokeStyle = "rgba(255, 0, 0, 0.4)";
            ctx.lineWidth = Math.max(img.width/250, 2);
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath(); ctx.stroke();

            pts.forEach((p, i) => {
                const s = Math.max(img.width/30, 20);
                ctx.strokeStyle = i === dragIdx ? "#00ff00" : "#ff0000";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(p.x - s, p.y); ctx.lineTo(p.x + s, p.y);
                ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x, p.y + s);
                ctx.stroke();
                ctx.beginPath(); ctx.arc(p.x, p.y, s/2, 0, Math.PI*2); ctx.stroke();
            });
            calculate();
        }

        function calculate() {
            if(!pts.length) return;
            const lw = (pts[0].x + pts[3].x) / 2;
            const rw = canvas.width - ((pts[1].x + pts[2].x) / 2);
            const th = (pts[0].y + pts[1].y) / 2;
            const bh = canvas.height - ((pts[2].y + pts[3].y) / 2);
            const lr = Math.round((lw / (lw + rw)) * 100);
            const tb = Math.round((th / (th + bh)) * 100);
            document.getElementById('lrRatio').innerText = `${lr}:${100-lr}`;
            document.getElementById('tbRatio').innerText = `${tb}:${100-tb}`;
            
            // 判定基準の切り替え
            const threshold = (currentMode === 'front') ? 10 : 25; // 表面なら±10(60:40), 裏面なら±25(75:25)
            const isPsa10 = (Math.abs(50 - lr) <= threshold) && (Math.abs(50 - tb) <= threshold);
            
            const check = document.getElementById('psaCheck');
            check.innerText = isPsa10 ? "★ PSA10 圏内 ★" : "PSA10 圏外";
            check.style.color = isPsa10 ? "#00ff00" : "#ff4444";
        }

        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        };

        canvas.addEventListener('touchstart', (e) => {
            const pos = getPos(e);
            const limit = Math.max(img.width/15, 40);
            pts.forEach((p, i) => {
                if (Math.hypot(p.x - pos.x, p.y - pos.y) < limit) dragIdx = i;
            });
            if(dragIdx !== -1) { loupe.style.display = 'block'; }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (dragIdx === -1) return;
            e.preventDefault();
            const pos = getPos(e);
            pts[dragIdx].x = pos.x; pts[dragIdx].y = pos.y;
            draw();
            // ルーペ更新
            const size = 160;
            loupeCanvas.width = size; loupeCanvas.height = size;
            lctx.drawImage(canvas, pos.x - size/2, pos.y - size/2, size, size, 0, 0, size, size);
            lctx.strokeStyle = "#00ff00"; lctx.lineWidth = 2;
            lctx.beginPath(); lctx.moveTo(size/2, 0); lctx.lineTo(size/2, size); lctx.moveTo(0, size/2); lctx.lineTo(size, size/2); lctx.stroke();
        }, {passive: false});

        window.addEventListener('touchend', () => { dragIdx = -1; loupe.style.display = 'none'; });
    </script>
</body>
</html>
