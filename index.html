<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ超速鑑定</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 2px solid #ccc; touch-action: none; }
        .btn { background: #007bff; color: white; padding: 15px 30px; border-radius: 10px; border: none; font-size: 18px; margin: 10px; }
    </style>
</head>
<body>
    <h3>ポケカ超速鑑定（タップ式）</h3>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">1. 画像を選ぶ</button>
    <p id="msg">画像を選んだら、カードの四隅をタップしてね</p>
    <canvas id="canvasInput"></canvas>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        let points = [];

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    points = []; msg.innerText = "四隅を順にタップ：左上→右上→右下→左下";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        canvas.addEventListener('click', (e) => {
            if (points.length >= 4) { points = []; ctx.clearRect(0,0,canvas.width,canvas.height); /* 画像再描画の処理を省略 */ }
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            points.push({x, y});
            ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
            
            if (points.length === 4) {
                const w1 = Math.abs(points[1].x - points[0].x);
                const w2 = Math.abs(points[2].x - points[3].x);
                const ratio = Math.round((w1 / (w1 + w2)) * 100);
                msg.innerText = "結果: 左右比率 " + ratio + " : " + (100 - ratio);
            }
        });
    </script>
</body>
</html>
