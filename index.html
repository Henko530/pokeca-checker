<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ鑑定：自動輪郭検知</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 2px solid #ccc; }
        .btn { background: #28a745; color: white; padding: 15px 30px; border-radius: 10px; border: none; font-size: 18px; margin: 10px; }
    </style>
</head>
<body>
    <h3>完全自動センタリング測定</h3>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">画像を選んで解析</button>
    <br>
    <canvas id="canvasInput"></canvas>
    <p id="msg" style="font-size: 20px; font-weight: bold; margin-top: 20px;">画像を読み込んでください</p>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    // 解析実行
                    analyzeContours();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function analyzeContours() {
            msg.innerText = "輪郭を抽出中...";
            // 簡易エッジ抽出
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixels = imgData.data;
            
            // 四隅の端を探索する（黒い余白をスキップ）
            let left = 0, right = canvas.width;
            for(let x = 0; x < canvas.width/2; x++) {
                if(pixels[( (canvas.height/2) * canvas.width + x ) * 4] > 50) { left = x; break; }
            }
            for(let x = canvas.width-1; x > canvas.width/2; x--) {
                if(pixels[( (canvas.height/2) * canvas.width + x ) * 4] > 50) { right = x; break; }
            }

            ctx.strokeStyle = "red"; ctx.lineWidth = 20;
            ctx.strokeRect(left, 0, right - left, canvas.height);
            
            const w1 = left;
            const w2 = canvas.width - right;
            const ratio = Math.round((w1 / (w1 + w2)) * 100);
            msg.innerText = "左右比率 " + ratio + " : " + (100 - ratio);
        }
    </script>
</body>
</html>
