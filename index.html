<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ簡易鑑定</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 2px solid #ccc; }
        .btn { background: #007bff; color: white; padding: 15px 30px; border-radius: 10px; border: none; font-size: 18px; margin: 10px; }
    </style>
</head>
<body>
    <h1>ポケカ簡易鑑定</h1>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">画像を選択する</button>
    <br>
    <canvas id="canvasInput"></canvas>
    <p id="msg">画像を読み込んでください</p>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    msg.innerText = "画像を表示しました！次はタップ位置を記録します。";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            ctx.fillStyle = "red";
            ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
            msg.innerText = "タップしました: X=" + Math.round(x) + ", Y=" + Math.round(y);
        });
    </script>
</body>
</html>
