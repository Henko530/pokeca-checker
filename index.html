<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ポケカ鑑定 Pro+斜め補正</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; background: #1a1a1a; color: white; }
        .controls { padding: 15px; background: #222; }
        .btn { background: #28a745; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; }
        .container { position: relative; display: inline-block; touch-action: none; }
        canvas { max-width: 100%; border: 1px solid #444; cursor: crosshair; }
        .result-panel { display: flex; justify-content: space-around; padding: 15px; background: #000; font-size: 18px; font-weight: bold; }
        .info { font-size: 12px; color: #aaa; padding: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <button class="btn" onclick="document.getElementById('fileInput').click()">画像を読み込む</button>
        <div class="info">4つの角の○を、カードの「枠のキワ」に合わせてください</div>
    </div>
    
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="result-panel">
        <div>左右 <span id="lrRatio">--:--</span></div>
        <div>上下 <span id="tbRatio">--:--</span></div>
    </div>
    <div id="psaCheck" style="font-size: 20px; font-weight: bold; padding: 10px;"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        // 4つの角の座標（初期値）
        let pts = [
            {x: 50, y: 50},   // 左上
            {x: 350, y: 50},  // 右上
            {x: 350, y: 550}, // 右下
            {x: 50, y: 550}   // 左下
        ];
        let dragIdx = -1;

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    const w = img.width, h = img.height;
                    pts = [
                        {x: w*0.15, y: h*0.15}, {x: w*0.85, y: h*0.15},
                        {x: w*0.85, y: h*0.85}, {x: w*0.15, y: h*0.85}
                    ];
                    draw();
                };
                img.src = f.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function draw() {
            ctx.drawImage(img, 0, 0);
            
            // 枠線を描画
            ctx.strokeStyle = "rgba(255, 0, 0, 0.6)";
            ctx.lineWidth = Math.max(img.width/150, 3);
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.stroke();

            // 角の○を描画
            pts.forEach((p, i) => {
                ctx.fillStyle = "rgba(255, 0, 0, 0.8)";
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(img.width/40, 15), 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.stroke();
            });
            calculate();
        }

        function calculate() {
            // 斜めを考慮した各辺の長さ（余白）を簡易計算
            const topW = pts[1].x - pts[0].x;
            const bottomW = pts[2].x - pts[3].x;
            const leftH = pts[3].y - pts[0].y;
            const rightH = pts[2].y - pts[1].y;

            const lw = (pts[0].x + pts[3].x) / 2;
            const rw = canvas.width - ((pts[1].x + pts[2].x) / 2);
            const th = (pts[0].y + pts[1].y) / 2;
            const bh = canvas.height - ((pts[2].y + pts[3].y) / 2);

            const lr = Math.round((lw / (lw + rw)) * 100);
            const tb = Math.round((th / (th + bh)) * 100);
            
            document.getElementById('lrRatio').innerText = `${lr}:${100-lr}`;
            document.getElementById('tbRatio').innerText = `${tb}:${100-tb}`;
            
            const isPsa10 = (lr >= 40 && lr <= 60) && (tb >= 40 && tb <= 60);
            const check = document.getElementById('psaCheck');
            check.innerText = isPsa10 ? "★ PSA10 圏内 ★" : "PSA10 圏外";
            check.style.color = isPsa10 ? "#00ff00" : "#ff4444";
        }

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            pts.forEach((p, i) => {
                const dist = Math.hypot(p.x - x, p.y - y);
                if (dist < 80) dragIdx = i; // 反応範囲
            });
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (dragIdx === -1) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            pts[dragIdx].x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            pts[dragIdx].y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            draw();
        }, {passive: false});

        window.addEventListener('touchend', () => dragIdx = -1);
    </script>
</body>
</html>
