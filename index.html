<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケカ自動検知</title>
    <script src="https://docs.opencv.org/4.5.4/opencv.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvasInput { max-width: 100%; border: 2px solid #ccc; }
        .btn { background: #007bff; color: white; padding: 15px; border-radius: 10px; border: none; font-size: 16px; margin: 5px; width: 90%; }
    </style>
</head>
<body>
    <h3>自動検知テスト</h3>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">1. 画像を選ぶ</button>
    <button class="btn" onclick="tryDetect()">2. 自動検知を開始</button>
    <br>
    <canvas id="canvasInput"></canvas>
    <p id="msg">画像を選んで「自動検知を開始」を押してね</p>

    <script>
        const canvas = document.getElementById('canvasInput');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        let imgElement = new Image();

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                imgElement.onload = () => {
                    canvas.width = imgElement.width;
                    canvas.height = imgElement.height;
                    ctx.drawImage(imgElement, 0, 0);
                    msg.innerText = "画像読み込み完了。";
                };
                imgElement.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function tryDetect() {
            try {
                msg.innerText = "検知中...";
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY, 0);
                cv.Canny(src, src, 50, 200, 3);
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(src, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                
                let maxArea = 0;
                let maxContour = null;
                for (let i = 0; i < contours.size(); ++i) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) { maxArea = area; maxContour = contours.get(i); }
                }
                
                if (maxContour) {
                    let rect = cv.boundingRect(maxContour);
                    ctx.strokeStyle = "red"; ctx.lineWidth = 10;
                    ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
                    msg.innerText = "検知成功！枠を描きました。";
                } else {
                    msg.innerText = "枠が見つかりませんでした。別の画像で試してください。";
                }
                src.delete(); gray.delete();
            } catch (err) {
                msg.innerText = "エラー発生: " + err.message;
            }
        }
    </script>
</body>
</html>
