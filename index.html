<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ポケカ鑑定 Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; background: #1a1a1a; color: white; }
        .container { position: relative; display: inline-block; touch-action: none; margin-top: 10px; }
        canvas { max-width: 100%; border: 1px solid #444; }
        .controls { padding: 15px; background: #222; }
        .btn { background: #28a745; color: white; padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; }
        .info { padding: 10px; background: #333; font-size: 14px; color: #ccc; }
        .result-panel { display: flex; justify-content: space-around; padding: 15px; background: #000; font-size: 18px; font-weight: bold; }
        .psa-label { color: #ffc107; font-size: 20px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <button class="btn" onclick="document.getElementById('fileInput').click()">画像を読み込む</button>
    </div>
    <div class="info">ガイド線をドラッグして枠に合わせてください</div>
    
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="result-panel">
        <div>左右 <span id="lrRatio">--:--</span></div>
        <div>上下 <span id="tbRatio">--:--</span></div>
    </div>
    <div id="psaCheck" class="psa-label">判定待ち...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let lines = { left: 50, right: 350, top: 50, bottom: 550 };
        let draggingLine = null;

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    lines = { 
                        left: img.width * 0.1, right: img.width * 0.9, 
                        top: img.height * 0.1, bottom: img.height * 0.9 
                    };
                    draw();
                };
                img.src = f.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function draw() {
            ctx.drawImage(img, 0, 0);
            ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
            ctx.lineWidth = Math.max(img.width / 100, 5);
            
            // ガイド線描画
            [lines.left, lines.right].forEach(x => {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            });
            [lines.top, lines.bottom].forEach(y => {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            });
            calculate();
        }

        function calculate() {
            const lw = lines.left; const rw = canvas.width - lines.right;
            const th = lines.top; const bh = canvas.height - lines.bottom;
            const lr = Math.round((lw / (lw + rw)) * 100);
            const tb = Math.round((th / (th + bh)) * 100);
            
            document.getElementById('lrRatio').innerText = `${lr}:${100-lr}`;
            document.getElementById('tbRatio').innerText = `${tb}:${100-tb}`;
            
            const isPsa10 = (lr >= 40 && lr <= 60) && (tb >= 40 && tb <= 60);
            const check = document.getElementById('psaCheck');
            check.innerText = isPsa10 ? "★ PSA10 圏内 ★" : "PSA10 圏外";
            check.style.color = isPsa10 ? "#00ff00" : "#ff4444";
        }

        // ドラッグ操作（スマホ対応）
        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);

        function handleStart(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            const dist = 50; // 当たり判定
            if (Math.abs(x - lines.left) < dist) draggingLine = 'left';
            else if (Math.abs(x - lines.right) < dist) draggingLine = 'right';
            else if (Math.abs(y - lines.top) < dist) draggingLine = 'top';
            else if (Math.abs(y - lines.bottom) < dist) draggingLine = 'bottom';
        }

        function handleMove(e) {
            if (!draggingLine) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            if (draggingLine === 'left') lines.left = x;
            if (draggingLine === 'right') lines.right = x;
            if (draggingLine === 'top') lines.top = y;
            if (draggingLine === 'bottom') lines.bottom = y;
            draw();
        }
        window.addEventListener('touchend', () => draggingLine = null);
    </script>
</body>
</html>
